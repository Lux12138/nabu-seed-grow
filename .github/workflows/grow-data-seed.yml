name: grow-data-seed
# Only this step needs macOS: growing an APFS container requires diskutil. Input and output are the
# packed DBRDISK1 form (~74 KB), so no large-file storage is involved.
on:
  workflow_dispatch:
    inputs:
      size_gib:
        description: "GiB to grow to. Keep below 2: above 2 GiB the RAM block needs a persistent store."
        required: true
        default: "1"
        type: string
      mode:
        description: "inspect = only report what the shipped container holds; grow = resize and repack"
        required: true
        default: "grow"
        type: choice
        options:
          - inspect
          - grow
      disable_watchdogd:
        description: "also mount the Data volume and write launchd disabled.plist for com.apple.watchdogd"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      root_own:
        description: "chown the injected launchd chain to root:wheel (launchd ignored the uid-501 copy on board)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      factorydata_upper:
        description: "create /var/hardware/FactoryData/... so BindFS stops failing with error 2"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      privvar_dirs:
        description: "create every /private/var directory from privvar-dirs.txt (82 entries) plus keybags 700"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: decide the flags
        id: flags
        run: |
          f=""
          [ '${{ inputs.disable_watchdogd }}' = 'true' ] && f="$f --disable-watchdogd"
          [ '${{ inputs.root_own }}' = 'true' ] && f="$f --root-own"
          [ '${{ inputs.factorydata_upper }}' = 'true' ] && f="$f --factorydata-upper"
          [ '${{ inputs.privvar_dirs }}' = 'true' ] && f="$f --privvar-manifest privvar-dirs.txt"
          echo "inject=$f" >> "$GITHUB_OUTPUT"
      - name: expand, read, grow, repack
        run: |
          mkdir -p out
          if [ "${{ inputs.mode }}" = inspect ]; then
            python3 grow_seed.py seed/seed-data-256m.dbrdisk out/unchanged.dbr --gib "${{ inputs.size_gib }}" --readonly
          else
            echo "grow flags: ${{ steps.flags.outputs.inject }}"
            python3 grow_seed.py seed/seed-data-256m.dbrdisk out/seed-grow.dbr --gib "${{ inputs.size_gib }}" ${{ steps.flags.outputs.inject }}
          fi
      - name: hashes
        run: |
          ls -l seed out
          shasum -a 256 seed/*.dbrdisk out/*.dbr
      - uses: actions/upload-artifact@v4
        with:
          name: seed-${{ inputs.mode }}-${{ inputs.size_gib }}gib
          path: out/

  verify:
    # Re-open the result with the same reader the board-side gate uses, so a bad grow is caught here
    # instead of costing a flash round.
    needs: mac
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: seed-${{ inputs.mode }}-${{ inputs.size_gib }}gib
          path: out
      - name: install the official APFS reader
        run: |
          sudo apt-get update
          sudo apt-get install -y apfsprogs libfsapfs-utils
      - name: unpack and identify
        run: python3 verify_seed.py out/*.dbr seed/*.dbrdisk
      - name: ask libfsapfs to read the grown container
        run: |
          python3 - <<'PY'
          import glob, pathlib, struct
          for p in sorted(glob.glob("out/*.dbr")):
              blob = pathlib.Path(p).read_bytes()
              count = struct.unpack_from("<8sIIQQ", blob, 0)[4]
              body = blob[32 + 16 * count:]
              pathlib.Path("/tmp/img.img").write_bytes(body)
              print(p, "->", "/tmp/img.img", len(body), "B")
              if b"com.apple.watchdogd" in body:
                  print("  the injected disabled.plist key is present in the container bytes")
          PY
          fsapfsinfo /tmp/img.img || echo "libfsapfs could not open this container (rc=$?) - it is a 2020 build and" \
            "our volumes carry newer feature bits; the board-side gate uses apfsprogs apfsck -c plus a direct" \
            "unpack, so this step is informational and must not decide the artifact"
