name: build-adreno-metal
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plugin:
    runs-on: macos-latest
    timeout-minutes: 300
    steps:
      - name: checkout UniXNU
        run: |
          git clone https://github.com/UniXNU/UniXNU.git src
          git -C src checkout 066c8d8315f83749d28bcae2faf3595718646be5
          git -C src submodule update --init --recursive || true
      - name: ci tweaks
        run: |
          mkdir -p src/drivers/Adreno740/tests
          git -C src/drivers/Adreno740 fetch --depth 1 origin main || true
          git -C src/drivers/Adreno740 show FETCH_HEAD:tests/HostKernelHooks.cpp > src/drivers/Adreno740/tests/HostKernelHooks.cpp || true
          wc -c src/drivers/Adreno740/tests/HostKernelHooks.cpp || true
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/scripts/check-turnip-darwin-host.py')
          t = p.read_text()
          t = t.replace("'-framework', 'CoreFoundation']", "'-framework', 'CoreFoundation', '-lproc']")
          anchor = "shim_obj = out / 'host_iokit_shim.o'"
          if anchor in t and 'HostKernelHooks' not in t:
              cmd = "subprocess.run(['xcrun', 'clang++', '-std=c++17', '-O1', '-fPIC', '-I', includes, '-I', sim, '-I', kit, '-I', ROOT / 'drivers/Adreno740/tests', '-c', ROOT / 'drivers/Adreno740/tests/HostKernelHooks.cpp', '-o', hooks], check=True)"
              insert = anchor + chr(10) + "hooks = out / 'HostKernelHooks.o'" + chr(10) + cmd + chr(10)
              t = t.replace(anchor, insert)
              t = t.replace("shim, service, shim_obj, *core, *objects,", "shim, service, shim_obj, hooks, *core, *objects,")
          p.write_text(t)
          print('host hooks + libproc added')
          PY
      - name: toolchain
        run: |
          brew install glslang shaderc spirv-tools meson ninja bison flex || true
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y || true
          . "$HOME/.cargo/env" 2>/dev/null || true
          which glslangValidator glslc spirv-val meson ninja cargo || true
      - name: mesa source + patches + venv
        run: |
          set -euo pipefail
          cd src
          mkdir -p .cache
          git clone --filter=blob:none --no-checkout https://chromium.googlesource.com/external/gitlab.freedesktop.org/mesa/mesa .cache/mesa-work
          cd .cache/mesa-work
          git fetch --depth 1 origin 85fda3b36405bcaea8bffc64aa4f2651dc90770d
          git checkout 85fda3b36405bcaea8bffc64aa4f2651dc90770d
          cd ../..
          for p in $(python3 -c "import json;print(' '.join(json.load(open('scripts/data/adreno-compiler-inputs.json'))['patches']))"); do
            echo "apply $p"
            git -C .cache/mesa-work apply "$PWD/$p" || patch -p1 -d .cache/mesa-work < "$PWD/$p"
          done
          python3 -m venv .cache/mesa-venv
          .cache/mesa-venv/bin/pip install --quiet meson ninja mako pyyaml ply packaging setuptools
      - name: turnip
        run: |
          . "$HOME/.cargo/env" 2>/dev/null || true
          export PATH="/opt/homebrew/opt/bison/bin:/opt/homebrew/bin:$PATH"
          cd src && (python3 scripts/build-turnip-darwin.py --target ios || (tail -80 .cache/mesa-tu-ios-build.log; exit 1))
      - name: turnip-host
        run: |
          . "$HOME/.cargo/env" 2>/dev/null || true
          export PATH="/opt/homebrew/opt/bison/bin:/opt/homebrew/bin:$PATH"
          cd src && (python3 scripts/build-turnip-darwin.py --target host || (tail -80 .cache/mesa-tu-build.log; exit 1))
      - name: plugin
        run: |
          . "$HOME/.cargo/env" 2>/dev/null || true
          export PATH="/opt/homebrew/opt/bison/bin:/opt/homebrew/bin:$PATH"
          cd src && python3 scripts/build-adreno-metal-plugin.py
      - uses: actions/upload-artifact@v4
        with:
          name: adreno-metal
          if-no-files-found: error
          path: |
            src/build/adreno-metal-plugin/NativeAdrenoMetal.bundle
            src/build/mesa-tu-ios/src/freedreno/vulkan/libvulkan_freedreno.dylib
            src/build/prime-list.txt
